services:
  jenkins:
    build: . 
    container_name: jenkins
   
    ports:
      - "8081:8080"
      - "50000:50000"
    
    dns:
      - 8.8.8.8

    privileged: true
    user: root
    
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      
volumes:
  jenkins_data: {}